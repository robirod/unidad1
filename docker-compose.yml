services:
  web:
    build: .
    image: salud-medica-web:${APP_VERSION:-1.0.0}
    container_name: ${APP_NAME:-centro-medico}-nginx
    ports:
      - "${HOST_PORT:-8080}:${CONTAINER_PORT:-80}"
    environment:
      - APP_ENV=${APP_ENV:-local}
      - TZ=${TZ:-America/Santiago}
    restart: unless-stopped