<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Horas - Centro de Salud Médica</title>
    <link rel="stylesheet" href="src/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-wrapper">
        <main class="card-container">
            <header class="card-header">
                <div class="logo-box">
                    <img src="_static/logo.svg" alt="Logo Centro Médico" class="logo-img">
                    <div class="logo-text">
                        <span class="brand-title">Salud Médica</span>
                        <span class="brand-subtitle">Centro Clínico</span>
                    </div>
                </div>
                <div class="title-box">
                    <h1>Reserva de horas</h1>
                    <p class="subtitle">Agenda tu atención médica en simples pasos</p>
                </div>
            </header>

            <form id="formReserva" class="card-form" novalidate>

                <div class="form-group full-width">
                    <label for="full_name">Nombre completo</label>
                    <div class="input-wrapper">
                        <span class="icon-container">
                            <img src="_static/user.svg" alt="Icono Usuario">
                        </span>
                        <input 
                            type="text" 
                            id="full_name" 
                            name="full_name" 
                            placeholder="Ej: Juan Pérez González" 
                            required 
                            maxlength="150"
                            autocomplete="name"
                        >
                    </div>
                    <span class="field-error" id="error_full_name"></span>
                </div>

                <div class="form-row two-cols">
                    <div class="form-group">
                        <label for="rut">RUT</label>
                        <div class="input-wrapper">
                            <span class="icon-container">
                                <img src="_static/edit.svg" alt="Icono RUT">
                            </span>
                            <input 
                                type="text" 
                                id="rut" 
                                name="rut" 
                                placeholder="12.345.678-K" 
                                required 
                                maxlength="12"
                                autocomplete="off"
                            >
                        </div>
                        <span class="field-error" id="error_rut"></span>
                    </div>

                    <div class="form-group">
                        <label for="phone">Teléfono</label>
                        <div class="input-wrapper has-prefix">
                            <span class="icon-container">
                                <img src="_static/call.svg" alt="Icono Teléfono">
                            </span>
                            <span class="input-prefix">+56 9</span>
                            <input 
                                type="tel" 
                                id="phone" 
                                name="phone" 
                                placeholder="1234 5678" 
                                required 
                                maxlength="9" 
                                inputmode="numeric"
                                autocomplete="tel-national"
                            >
                        </div>
                        <span class="field-error" id="error_phone"></span>
                    </div>
                </div>

                <!-- Fila 3: Especialidad médica -->
                <div class="form-group full-width">
                    <label for="especialidad">Especialidad</label>
                    <div class="input-wrapper">
                        <span class="icon-container">
                            <img src="_static/specialty.svg" alt="Icono Especialidad">
                        </span>
                        <select id="especialidad" name="especialidad" required>
                            <option value="" disabled selected>Selecciona una especialidad médica</option>
                            <option value="medicina-general">Medicina General</option>
                            <option value="pediatria">Pediatría</option>
                            <option value="cardiologia">Cardiología</option>
                            <option value="traumatologia">Traumatología</option>
                            <option value="dermatologia">Dermatología</option>
                            <option value="odontologia">Odontología</option>
                            <option value="oftalmologia">Oftalmología</option>
                            <option value="ginecologia">Ginecología</option>
                            <option value="neurologia">Neurología</option>
                        </select>
                    </div>
                    <span class="field-error" id="error_especialidad"></span>
                </div>

                <!-- Fila 4: Fecha y Botón Enviar (2 columnas) -->
                <div class="form-row two-cols action-row">
                    <div class="form-group">
                        <label for="fecha">Fecha</label>
                        <div class="input-wrapper">
                            <span class="icon-container">
                                <img src="_static/calendar.svg" alt="Icono Calendario">
                            </span>
                            <input 
                                type="date" 
                                id="fecha" 
                                name="fecha" 
                                required
                            >
                        </div>
                        <span class="field-error" id="error_fecha"></span>
                    </div>

                    <div class="form-group submit-group">
                        <label class="sr-only" for="submitBtn">Enviar</label>
                        <button type="submit" id="submitBtn" class="btn-primary">
                            <span class="btn-text">Enviar</span>
                            <span class="btn-icon">→</span>
                        </button>
                    </div>
                </div>

                <!-- Mensaje de confirmación o alerta -->
                <div id="statusMessage" class="status-message" style="display: none;"></div>
            </form>

            <!-- Pie del Formulario (Footer) -->
            <footer class="card-footer">
                <div class="footer-content">
                    <p class="copyright">© 2026 Centro de Salud Médica · Todos los derechos reservados</p>
                    <p class="contact-info">Mesa de ayuda: <a href="tel:+56222345678">+56 2 2234 5678</a> | Santiago, Chile</p>
                </div>
            </footer>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('formReserva');
            const rutInput = document.getElementById('rut');
            const phoneInput = document.getElementById('phone');
            const fechaInput = document.getElementById('fecha');
            const statusMessage = document.getElementById('statusMessage');
            const submitBtn = document.getElementById('submitBtn');

            // Establecer fecha mínima a partir de hoy
            const today = new Date().toISOString().split('T')[0];
            fechaInput.min = today;

            // Formateador dinámico de RUT chileno (ej: 12.345.678-K)
            rutInput.addEventListener('input', (e) => {
                let value = e.target.value.replace(/[^0-9kK]/g, '').toUpperCase();
                if (value.length > 9) value = value.slice(0, 9);
                
                if (value.length > 1) {
                    const cuerpo = value.slice(0, -1);
                    const dv = value.slice(-1);
                    let formatted = '';
                    for (let i = cuerpo.length - 1, j = 1; i >= 0; i--, j++) {
                        formatted = cuerpo.charAt(i) + formatted;
                        if (j % 3 === 0 && i !== 0) {
                            formatted = '.' + formatted;
                        }
                    }
                    e.target.value = `${formatted}-${dv}`;
                } else {
                    e.target.value = value;
                }
            });

            phoneInput.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/\D/g, '').slice(0, 8);
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();

                if (!form.checkValidity()) {
                    showMessage('Por favor, completa todos los campos requeridos correctamente.', 'error');
                    return;
                }

                submitBtn.disabled = true;
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<span>Procesando...</span>';

                setTimeout(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                    
                    const nombre = document.getElementById('full_name').value;
                    showMessage(`¡Gracias, ${nombre}! Tu solicitud de reserva ha sido enviada con éxito. Te contactaremos a la brevedad.`, 'success');
                    form.reset();
                }, 1000);
            });

            function showMessage(text, type) {
                statusMessage.textContent = text;
                statusMessage.className = `status-message ${type}`;
                statusMessage.style.display = 'block';
                statusMessage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        });
    </script>
</body>

</html>
